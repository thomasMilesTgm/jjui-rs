# Optional jjui muscle-memory preset for jjui-rs.
# Load: jjui-rs --keybinds /path/to/keybinds/keybinds.jjui.toml
# Or copy to ~/.config/jjui-rs/keybinds.toml.
# Source: https://github.com/idursun/jjui/blob/main/internal/config/default/bindings.toml
#
# Matches the available equivalents, not every upstream mode or action.
# Unsupported actions (e.g. ace jump, set parents, revert, selection inversion)
# are not mapped to unrelated commands. ? opens help instead of expanding status.
# All prompts share [input]: Enter submits, Alt-Enter inserts a newline, Ctrl-S
# accepts. jjui's description-only Enter/newline behavior cannot be configured
# independently here. Evolution/undo/redo retain jjui-rs's existing behavior.
#
# Extensions: O opens related operations inline; H opens hunks in file details
# (jjui uses i to invert selection). The native hunk editor keeps its own keys.
# Theme reload is unbound to leave g available for Git.
# Preview Ctrl-N/P/D/U use the global bindings unless a view overrides them.
# This example is NOT automatically loaded; the default Vim-style keys remain.

[global]
quit = ["q", "ctrl+c"]
cancel = ["esc"]
help = ["f1", "?"]
command = [":"]
refresh = ["ctrl+r"]
theme_reload = []
preview_down = ["ctrl+n"]
preview_up = ["ctrl+p"]
preview_page_down = ["ctrl+d"]
preview_page_up = ["ctrl+u"]

# jjui: n new, v evolution, g Git, o full operation log, Space select, U redo.
[revisions]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
half_page_down = []
page_up = ["pageup"]
half_page_up = []
first = ["home"]
last = ["end"]
working_copy = ["@"]
parent = ["J"]
child = ["K"]
select = ["space"]
search = ["/"]
search_backward = []
next_match = ["'"]
previous_match = ["\""]
details = ["l", "right"]
diff = ["d"]
preview = ["p"]
preview_position = ["P"]
focus = ["tab"]
bookmarks = ["b"]
revset = ["L"]
new = ["n"]
describe = ["enter"]
describe_editor = ["D"]
edit = ["e"]
rebase = ["r"]
squash = ["S"]
abandon = ["a"]
absorb = ["A"]
duplicate = ["y"]
split = ["s"]
diff_edit = ["E"]
commit = ["c"]
set_bookmark = ["B"]
undo = ["u"]
redo = ["U"]
operations = ["O"]
full_operations = ["o"]
evolution = ["v"]
git = ["g"]
file_search = ["ctrl+t"]
command = [":"]
shell = ["$"]
history = ["W"]
snapshot = ["ctrl+s"]

# Leave i unused: jjui uses it for selection inversion, not hunk editing.
[files]
chunks = ["H"]
focus = ["tab"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
half_page_down = []
page_up = ["pageup"]
half_page_up = []
first = ["home"]
last = ["end"]
cancel = ["h", "left", "esc"]
diff = ["d"]
preview = ["p"]
preview_position = ["P"]
select = ["m", "space"]
search = ["/"]
restore = ["r"]
split = ["s"]
squash = ["S"]
absorb = ["A"]

[view]
chunks = ["i"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
half_page_down = ["ctrl+d"]
page_up = ["pageup"]
half_page_up = ["ctrl+u"]
first = ["g", "home"]
last = ["G", "end"]
cancel = ["esc", "h", "left"]

[bookmarks]
page_up = ["pageup"]
half_page_up = []
page_down = ["pagedown"]
half_page_down = []
first = ["home"]
last = ["end"]
down = ["j", "down"]
up = ["k", "up"]
cancel = ["esc"]
bookmark_apply = ["enter"]
bookmark_move = ["m"]
bookmark_delete = ["d"]
bookmark_forget = ["f"]
search = ["/"]
bookmark_next_remote = ["tab"]
bookmark_previous_remote = ["shift+tab"]
set_bookmark = ["B"]
bookmark_track = ["t"]
bookmark_untrack = ["u"]

[operations]
diff = ["d"]
operations = ["O"]
full_operations = ["o"]
page_up = ["pageup"]
half_page_up = []
page_down = ["pagedown"]
half_page_down = []
first = ["home"]
last = ["end"]
down = ["j", "down"]
up = ["k", "up"]
cancel = ["esc"]
operation_restore = ["r"]

[git]
down = ["j", "down"]
up = ["k", "up"]
bookmark_apply = ["enter"]
bookmark_next_remote = ["tab"]
bookmark_previous_remote = ["shift+tab"]
search = ["/"]
cancel = ["esc"]
fetch = ["f"]
push = ["p"]
remote_add = ["a"]
remote_remove = ["d"]

# Shared prompt bindings; see the description-mode limitation above.
[input]
complete = ["tab"]
complete_back = ["shift+tab"]
cancel = ["esc", "ctrl+[", "ctrl+c"]
submit = ["enter"]
backspace = ["backspace", "ctrl+h"]
delete_word = ["ctrl+w"]
delete_to_start = ["ctrl+u"]
delete = ["delete"]
cursor_left = ["left"]
cursor_right = ["right"]
input_home = ["home", "ctrl+a"]
input_end = ["end", "ctrl+e"]
newline = ["alt+enter"]
accept = ["ctrl+s"]

[finder]
first = ["home"]
last = ["end"]
down = ["down", "ctrl+n"]
up = ["up", "ctrl+p"]
page_down = ["pagedown", "ctrl+d"]
half_page_down = []
page_up = ["pageup", "ctrl+u"]
half_page_up = []
cancel = ["esc"]
search = ["/"]
open_file = ["enter"]

# jjui-rs extension: inline hunk editing.
[chunks]
scroll_down = ["ctrl+e"]
scroll_up = ["ctrl+y"]
down = ["j", "down"]
up = ["k", "up"]
first = ["g g", "home"]
last = ["G", "end"]
page_down = ["ctrl+f", "pagedown"]
page_up = ["ctrl+b", "pageup"]
half_page_down = ["ctrl+d"]
half_page_up = ["ctrl+u"]
select = ["v", "space"]
select_all = ["a"]
restore = ["r"]
split = ["s"]
cancel = ["h", "left", "esc"]

