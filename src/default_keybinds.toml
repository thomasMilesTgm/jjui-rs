# Built-in defaults. Override any action with an array of keys; [] disables it.
# Scopes take precedence over global bindings. Keys are case-sensitive.

[global]
quit = ["ctrl+c", "Z Q"]
cancel = ["esc", "ctrl+["]
help = ["f1", "g ?"]
command = [":"]
refresh = ["ctrl+l"]
preview_down = []
preview_up = []
preview_page_down = []
preview_page_up = []

[revisions]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["ctrl+f", "pagedown"]
half_page_down = ["ctrl+d"]
page_up = ["ctrl+b", "pageup"]
half_page_up = ["ctrl+u"]
first = ["g g", "home"]
last = ["G", "end"]
working_copy = ["@"]
parent = ["J"]
child = ["K"]
select = ["v", "space"]
search = ["/"]
search_backward = ["?"]
next_match = ["n"]
previous_match = ["N"]
details = ["l", "right"]
diff = ["d"]
preview = ["p"]
preview_position = ["P"]
focus = ["ctrl+w w", "tab"]
bookmarks = ["b"]
revset = ["L"]
new = ["g n"]
describe = ["i", "enter"]
describe_editor = ["D"]
edit = ["e"]
rebase = ["r"]
squash = ["S"]
abandon = ["a"]
absorb = ["A"]
duplicate = ["y"]
split = ["s"]
diff_edit = ["E"]
commit = ["c"]
set_bookmark = ["B"]
undo = ["u"]
