operations = ["o"]
full_operations = ["O"]
evolution = ["g v"]
git = ["g p"]
file_search = ["ctrl+t"]
command = [":"]
shell = ["$"]
history = ["W"]
snapshot = ["ctrl+s"]

[files]
focus = ["ctrl+w w", "tab"]
down = ["j", "down"]
up = ["k", "up"]
