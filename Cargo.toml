[package]
name = "jjui-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures = "0.3"
jj-lib = "=0.46.0"
notify = "8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1"
shell-words = "1"
chrono = "0.4"

tempfile = "3"
