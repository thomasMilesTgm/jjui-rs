[package]
name = "jjui-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A live terminal UI for Jujutsu with native repository access"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasMilesTgm/jjui-rs"
readme = "README.md"
keywords = ["jujutsu", "jj", "tui", "version-control"]
categories = ["command-line-utilities", "development-tools::version-control"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-*",
    "/src/**",
    "/keybinds/*.toml",
    "/themes/*.toml",
    "/examples/**",
    "/docs/**",
    "/tests/**",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
futures = "0.3"
jj-lib = "=0.46.0"
notify = "8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1"
shell-words = "1"
chrono = "0.4"

tempfile = "3"
roto = { version = "=0.13.0", default-features = false }
