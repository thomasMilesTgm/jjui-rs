# Built-in defaults. Override any action with an array of keys; [] disables it.
# Scopes take precedence over global bindings. Keys are case-sensitive.

[global]
quit = ["ctrl+c", "ctrl+d"]
cancel = ["esc"]
help = ["?", "f1"]
refresh = ["ctrl+r"]
preview_down = ["ctrl+n"]
preview_up = ["ctrl+p"]
preview_page_down = ["ctrl+j"]
preview_page_up = ["ctrl+k"]

[revisions]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
page_up = ["pageup"]
first = ["home"]
last = ["end"]
working_copy = ["@"]
parent = ["J"]
child = ["K"]
select = ["space"]
search = ["/"]
next_match = ["'"]
previous_match = ["\""]
details = ["l", "right"]
diff = ["d"]
preview = ["p"]
preview_position = ["P"]
focus = ["tab"]
bookmarks = ["b"]
revset = ["L"]
new = ["n"]
describe = ["enter"]
describe_editor = ["D"]
edit = ["e"]
rebase = ["r"]
squash = ["S"]
abandon = ["a"]
absorb = ["A"]
duplicate = ["y"]
split = ["s"]
diff_edit = ["E"]
commit = ["c"]
set_bookmark = ["B"]
undo = ["u"]
redo = ["U"]
operations = ["o"]
evolution = ["v"]
git = ["g"]
file_search = ["ctrl+t"]
command = [":"]
shell = ["$"]
history = ["W"]
snapshot = ["ctrl+s"]

[files]
focus = ["tab"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
page_up = ["pageup"]
first = ["home"]
last = ["end"]
cancel = ["h", "left", "esc"]
diff = ["d"]
preview = ["p"]
preview_position = ["P"]
select = ["space", "m"]
search = ["/"]
restore = ["r"]
split = ["s"]
squash = ["S"]
absorb = ["A"]

[view]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
page_up = ["pageup"]
first = ["home"]
last = ["end"]
cancel = ["h", "left", "esc"]

[bookmarks]
page_up = ["pageup"]
page_down = ["pagedown"]
first = ["home"]
last = ["end"]
down = ["j", "down"]
up = ["k", "up"]
cancel = ["h", "left", "esc"]
bookmark_delete = ["d"]
set_bookmark = ["B"]
bookmark_track = ["t"]
bookmark_untrack = ["u"]

[operations]
page_up = ["pageup"]
page_down = ["pagedown"]
first = ["home"]
last = ["end"]
down = ["j", "down"]
up = ["k", "up"]
cancel = ["h", "left", "esc"]
operation_restore = ["r"]

[git]
cancel = ["h", "left", "esc"]
fetch = ["f"]
push = ["p"]
remote_add = ["a"]
remote_remove = ["d"]

[input]
cancel = ["esc"]
submit = ["enter"]
backspace = ["backspace"]
delete = ["delete"]
cursor_left = ["left"]
cursor_right = ["right"]
input_home = ["home", "ctrl+a"]
input_end = ["end", "ctrl+e"]
newline = ["alt+enter"]
accept = ["ctrl+s"]

[finder]
first = ["home"]
last = ["end"]
down = ["j", "down"]
up = ["k", "up"]
page_down = ["pagedown"]
page_up = ["pageup"]
cancel = ["esc", "h", "left"]
search = ["/"]
open_file = ["enter"]
