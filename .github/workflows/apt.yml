name: Publish signed APT repository

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Release Linux binaries and AUR recipes', 'Package existing Debian release']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  repository:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg
      - name: Download verified packages from all stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/collect-debs.py --output packages
      - name: Build and sign repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          test -n "$APT_SIGNING_KEY"
          test -n "$APT_SIGNING_FINGERPRINT"
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          python3 scripts/build-apt-repo.py --packages packages --output site \
            --signing-key "$APT_SIGNING_FINGERPRINT"
          gpg --verify site/dists/stable/InRelease
          gpg --dearmor < packaging/apt/jjui-rs-archive-keyring.asc > expected.gpg
          cmp expected.gpg site/jjui-rs-archive-keyring.gpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: repository
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy signed APT repository
        id: deployment
        uses: actions/deploy-pages@v4
